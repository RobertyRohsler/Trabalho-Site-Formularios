<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscrição | Qualifica+</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Qualifica+</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="cursos.html">Cursos</a>
        <a href="cadastro.html">Inscreva-se</a>
        <a href="contato.html">Contato</a>
    </nav>

</header>

<main>

<section class="formulario">

    <h2>Inscreva-se em um curso</h2>

    <form>

        <label for="nome">Nome completo:</label>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
        >

        <label for="email">E-mail:</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
        >

        <label for="telefone">Telefone:</label>

        <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(00) 00000-0000"
        >

        <label for="curso">Escolha o curso:</label>

        <select id="curso" name="curso">

            <option value="">Selecione</option>

            <option value="informatica">
                Informática Básica
            </option>

            <option value="programacao">
                Programação Web
            </option>

            <option value="design">
                Design Gráfico
            </option>

            <option value="administrativo">
                Assistente Administrativo
            </option>

        </select>

        <label for="modalidade">Modalidade:</label>

        <div>

            <input type="radio" name="modalidade" value="online">
            Online

            <input type="radio" name="modalidade" value="presencial">
            Presencial

        </div>

        <label for="observacoes">Observações:</label>

        <textarea
            id="observacoes"
            name="observacoes"
            rows="5"
            placeholder="Digite alguma observação..."
        ></textarea>

        <button type="submit" class="botao">
            Enviar inscrição
        </button>

    </form>

</section>

</main>

<footer>
    <p>© 2026 Qualifica+</p>
</footer>

</body>
</html>
