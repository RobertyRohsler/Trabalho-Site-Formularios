
<!DOCTYPE html>

<main>

        <h2>Resultado da inscrição</h2>

        <p id="statusInscricao" role="status" aria-live="polite">

        </p>

        <div id="dadosInscricao" hidden>

            <p><strong>Curso:</strong> <span id="resultadoCurso"></span></p>
            <p><strong>Modalidade:</strong> <span id="resultadoModalidade"></span></p>
            <p><strong>Observações:</strong> <span id="resultadoObservacoes"></span></p>
        </div>

        <p>
            <a href="cadastro.html" class="botao">Voltar ao formulário</a>

        <p>
            <a href="index.html">Voltar à página inicial</a>
